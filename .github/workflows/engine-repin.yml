name: Engine re-pin

# Watches maxgfr/codeindex for a new engine release and re-pins it here.
# All gates green -> pushed straight to main (no PR, no human in the loop).
# Any gate red -> nothing is pushed and no PR is opened; the run just fails
# and the next daily cron retries. A red run is the signal to investigate.
on:
  schedule:
    - cron: "24 6 * * *" # daily; minute offset staggered per repo to spread load
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency: engine-repin

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Driven by `sync-engine.mjs --list` rather than by a copy of the engine
      # table kept here: adding an engine to the script is then the only edit
      # needed, and the automation cannot drift from the list it is watching.
      - name: Re-pin every engine that has a newer release
        id: detect
        run: |
          set -euo pipefail
          SUMMARY=""
          while read -r NAME REPO PINNED; do
            # NOT releases/latest: a repo may also publish non-engine asset
            # releases (codeindex publishes embed-model-v1), which are not tags
            # this can pin to.
            LATEST=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::could not determine the latest ${NAME} release tag"
              exit 1
            fi
            if [ "$PINNED" = "$LATEST" ]; then
              echo "${NAME}: up to date (${PINNED})"
              continue
            fi
            echo "${NAME}: ${PINNED} -> ${LATEST}"
            node scripts/sync-engine.mjs --engine "$NAME" --ref "$LATEST"
            SUMMARY="${SUMMARY}${NAME} ${PINNED} -> ${LATEST}"$'\n'
          done < <(node scripts/sync-engine.mjs --list)

          if [ -z "$SUMMARY" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              printf '%s' "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the vendored engines match their new pins
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/sync-engine.mjs --check

      # Gate order below mirrors this cycle's local flow: test, typecheck,
      # lint, then rebuild+stage the bundle BEFORE check:build. check:build
      # itself reruns tsup+copy-bundle and diffs the *working tree against the
      # index* (`git diff --exit-code`) — staging the freshly rebuilt bundle
      # first is what makes that diff clean, exactly like the local flow.
      - name: Test
        if: steps.detect.outputs.repin == 'true'
        run: pnpm test 2>&1 | tee test-output.log

      - name: Typecheck
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run lint

      - name: Rebuild bundle and stage it
        if: steps.detect.outputs.repin == 'true'
        run: |
          pnpm run build
          git add -A

      - name: Build is reproducible + install-bundle shape + engine pin (check:build)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run check:build

      - name: Configure git identity
        if: steps.detect.outputs.repin == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push re-pin to main (all gates green)
        if: steps.detect.outputs.repin == 'true'
        id: push
        env:
          SUMMARY: ${{ steps.detect.outputs.summary }}
        run: |
          set -euo pipefail
          COUNTS=$(grep -E '^\s*(Test Files|Tests)\s' test-output.log || echo "test counts unavailable")
          # printf, not a multi-line literal: this file's indentation would
          # otherwise be baked into the commit body.
          BODY=$(printf '%s%s\n' "$SUMMARY" "$COUNTS")
          git add -A
          git commit -m "feat(engine): re-pin vendored engines" \
            -m "automated re-pin, all gates green, goldens byte-identical" \
            -m "$BODY"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push authenticated with the default GITHUB_TOKEN does not trigger
      # other workflows (known GH Actions limitation) — trigger them explicitly.
      - name: Trigger release and CI on the new main
        if: steps.detect.outputs.repin == 'true'
        run: |
          gh workflow run release.yml --ref main
          gh workflow run ci.yml --ref main

      # A red re-pin means this repo has stopped following the engine. Nothing
      # used to carry that signal out of the Actions tab, so ultrasec failed
      # three nights running in August before a human noticed. One open issue per
      # repo, a comment on each further failure, closed by the first green run.
      - name: Report the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create engine-repin --color B60205 --description "The automated engine re-pin needs a human" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          # Built with printf rather than a multi-line literal: this file's own
          # indentation would otherwise be carried into the body and render the
          # whole message as a code block.
          BODY=$(printf '%s\n\n%s\n' \
            "The daily engine re-pin failed: ${RUN}" \
            "Nothing was pushed, so main is not broken — the pin is simply frozen where it was, and this repo stays behind the engine until someone looks.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "Engine re-pin is failing" --label engine-repin --body "$BODY"
          fi

      - name: Close the tracking issue once a run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then exit 0; fi
          gh issue close "$NUM" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
